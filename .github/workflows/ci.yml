name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: pwsh
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -t . *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt | Select-Object -Last 80
          if ($code -ne 0) {
            # also show the end of the output as an annotation, which is readable without opening the raw log
            $text = Get-Content test-output.txt -Raw
            $tail = $text.Substring([Math]::Max(0, $text.Length - 3500))
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=unittest failed::$tail"
            exit 1
          }
      - run: python -m disk_cleaner --version
