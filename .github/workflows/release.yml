name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    # Signing waits for a manual approval in SignPath, which can take hours.
    timeout-minutes: 360
    permissions:
      contents: write   # publish the release
      actions: read     # lets the SignPath action read this run's artifacts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag must match the code version and be on main
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (python make_version_info.py --print).Trim()
          $short = ($v -replace '\.0$', '')
          if ($env:TAG -ne "v$short") { throw "Tag $env:TAG does not match code version $short" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit is not on main" }
          "VERSION4=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
      - run: python -m unittest discover -s tests -t .
      - run: python -m pip install -r requirements-build.txt
      - run: .\build_exe.bat
        shell: cmd

      # Signing is skipped until the repository variable SIGNPATH_ORGANIZATION_ID is set (see docs/signpath-setup.md).
      - name: Upload unsigned exe for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DiskCleaner-unsigned
          path: dist/DiskCleaner.exe
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'disk-cleaner' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: signed
          parameters: |
            version: "${{ env.VERSION4 }}"
      - name: Use the signed exe when available
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Get-ChildItem signed
          Copy-Item signed\DiskCleaner.exe dist\DiskCleaner.exe -Force
          $sig = Get-AuthenticodeSignature dist\DiskCleaner.exe
          "Signature status: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signed exe does not have a valid signature" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DiskCleaner.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\DiskCleaner.exe.sha256", "$h  DiskCleaner.exe`n")
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/DiskCleaner.exe
            dist/DiskCleaner.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
