name: Bug report
description: Something does not work, looks wrong, or suggested the wrong thing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **If TickClean deleted something it should not have, say so clearly in the title.**
        For security problems please do not use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TickClean version
      description: Shown in the window title (for example 0.1.0), or run `TickClean.exe --version`.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - TickClean.exe from a release
        - From source (python -m tickclean)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options: ["No", "Yes", "Not sure"]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: The log is in %LOCALAPPDATA%\TickClean\logs. Remove anything private (user names, folder names) before pasting.
      render: text
